AWSTemplateFormatVersion: '2010-09-09'
Description: 'Media Conversion Pipeline with Translation and Video Processing Lambda functions'

Parameters:
  EnvironmentName:
    Type: String
    Default: 'dev'
    Description: 'Environment name for resource naming'
    
  InputBucketName:
    Type: String
    Description: 'Name of the input S3 bucket for media files'
    
  OutputBucketPrefix:
    Type: String
    Default: 'media-output'
    Description: 'Prefix for the output bucket name'

Resources:
  # S3 Buckets
  OutputBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${OutputBucketPrefix}-${EnvironmentName}-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # IAM Roles
  TranslationLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvironmentName}-TranslationLambdaRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: TranslationLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/TranslationLambda-${EnvironmentName}*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub 'arn:aws:s3:::${InputBucketName}/*'
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:PutObjectAcl
                Resource: !Sub '${OutputBucket}/*'
              - Effect: Allow
                Action:
                  - transcribe:*
                Resource: '*'

  VideoProcessingLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvironmentName}-VideoProcessingLambdaRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: VideoProcessingLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/VideoProcessingLambda-${EnvironmentName}*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub 'arn:aws:s3:::${InputBucketName}/*'
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:PutObjectAcl
                Resource: !Sub '${OutputBucket}/*'
              - Effect: Allow
                Action:
                  - mediaconvert:*
                  - iam:PassRole
                Resource: '*'

  # CloudWatch Log Groups
  TranslationLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/TranslationLambda-${EnvironmentName}'
      RetentionInDays: 14

  VideoProcessingLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/VideoProcessingLambda-${EnvironmentName}'
      RetentionInDays: 14

  # Lambda Functions
  TranslationLambda:
    Type: AWS::Lambda::Function
    DependsOn:
      - TranslationLambdaLogGroup
      - TranslationLambdaRole
    Properties:
      FunctionName: !Sub 'TranslationLambda-${EnvironmentName}'
      Runtime: python3.9
      Handler: index.lambda_handler
      Role: !GetAtt TranslationLambdaRole.Arn
      Timeout: 300
      MemorySize: 512
      Environment:
        Variables:
          OUTPUT_BUCKET: !Ref OutputBucket
          INPUT_BUCKET: !Ref InputBucketName
          ENVIRONMENT: !Ref EnvironmentName
          LOG_LEVEL: INFO
      Code:
        ZipFile: |
          import json
          import boto3
          import logging
          import os
          from urllib.parse import unquote_plus

          # Configure logging
          logger = logging.getLogger()
          logger.setLevel(os.environ.get('LOG_LEVEL', 'INFO'))

          # Initialize AWS clients
          transcribe = boto3.client('transcribe')
          s3 = boto3.client('s3')

          def lambda_handler(event, context):
              try:
                  logger.info(f"Received event: {json.dumps(event)}")
                  
                  # Process S3 event
                  for record in event.get('Records', []):
                      bucket = record['s3']['bucket']['name']
                      key = unquote_plus(record['s3']['object']['key'])
                      
                      logger.info(f"Processing file: s3://{bucket}/{key}")
                      
                      # Start transcription job
                      job_name = f"transcription-{context.aws_request_id}"
                      file_uri = f"s3://{bucket}/{key}"
                      output_bucket = os.environ['OUTPUT_BUCKET']
                      
                      response = transcribe.start_transcription_job(
                          TranscriptionJobName=job_name,
                          Media={'MediaFileUri': file_uri},
                          MediaFormat='mp4',  # Adjust based on your media format
                          LanguageCode='en-US',
                          OutputBucketName=output_bucket,
                          OutputKey=f"transcriptions/{key}.json"
                      )
                      
                      logger.info(f"Started transcription job: {job_name}")
                      
                  return {
                      'statusCode': 200,
                      'body': json.dumps('Successfully processed transcription request')
                  }
                  
              except Exception as e:
                  logger.error(f"Error processing transcription: {str(e)}")
                  raise

  VideoProcessingLambda:
    Type: AWS::Lambda::Function
    DependsOn:
      - VideoProcessingLambdaLogGroup
      - VideoProcessingLambdaRole
      - OutputBucket
    Properties:
      FunctionName: !Sub 'VideoProcessingLambda-${EnvironmentName}'
      Runtime: python3.9
      Handler: index.lambda_handler
      Role: !GetAtt VideoProcessingLambdaRole.Arn
      Timeout: 900
      MemorySize: 1024
      Environment:
        Variables:
          OUTPUT_BUCKET: !Ref OutputBucket
          INPUT_BUCKET: !Ref InputBucketName
          ENVIRONMENT: !Ref EnvironmentName
          LOG_LEVEL: INFO
      Code:
        ZipFile: |
          import json
          import boto3
          import logging
          import os
          from urllib.parse import unquote_plus

          # Configure logging
          logger = logging.getLogger()
          logger.setLevel(os.environ.get('LOG_LEVEL', 'INFO'))

          # Initialize AWS clients
          mediaconvert = boto3.client('mediaconvert')
          s3 = boto3.client('s3')

          def lambda_handler(event, context):
              try:
                  logger.info(f"Received event: {json.dumps(event)}")
                  
                  # Handle transcription completion events
                  if 'detail' in event and event.get('source') == 'aws.transcribe':
                      return handle_transcription_completion(event, context)
                  
                  # Handle S3 events for video processing
                  for record in event.get('Records', []):
                      bucket = record['s3']['bucket']['name']
                      key = unquote_plus(record['s3']['object']['key'])
                      
                      logger.info(f"Processing video file: s3://{bucket}/{key}")
                      
                      # Process video file
                      process_video(bucket, key, context)
                      
                  return {
                      'statusCode': 200,
                      'body': json.dumps('Successfully processed video files')
                  }
                  
              except Exception as e:
                  logger.error(f"Error processing video: {str(e)}")
                  raise

          def handle_transcription_completion(event, context):
              """Handle transcription job completion events"""
              try:
                  detail = event['detail']
                  job_name = detail['TranscriptionJobName']
                  job_status = detail['TranscriptionJobStatus']
                  
                  logger.info(f"Transcription job {job_name} completed with status: {job_status}")
                  
                  if job_status == 'COMPLETED':
                      # Get transcription results
                      transcription_uri = detail['Transcript']['TranscriptFileUri']
                      logger.info(f"Transcription results available at: {transcription_uri}")
                      
                      # Process transcription data
                      process_transcription_data(transcription_uri)
                      
                  return {
                      'statusCode': 200,
                      'body': json.dumps(f'Processed transcription completion for job: {job_name}')
                  }
                  
              except Exception as e:
                  logger.error(f"Error handling transcription completion: {str(e)}")
                  raise

          def process_transcription_data(transcription_uri):
              """Process transcription data from S3"""
              try:
                  # Extract bucket and key from URI
                  uri_parts = transcription_uri.replace('s3://', '').split('/', 1)
                  bucket = uri_parts[0]
                  key = uri_parts[1]
                  
                  # Get transcription data
                  response = s3.get_object(Bucket=bucket, Key=key)
                  transcription_data = json.loads(response['Body'].read())
                  
                  # Fix JSON path for transcription data processing
                  if 'results' in transcription_data and 'transcripts' in transcription_data['results']:
                      transcript_text = transcription_data['results']['transcripts'][0]['transcript']
                      logger.info(f"Extracted transcript: {transcript_text[:100]}...")
                      
                      # Save processed transcript to output bucket
                      output_bucket = os.environ['OUTPUT_BUCKET']
                      output_key = f"processed-transcripts/{key}"
                      
                      processed_data = {
                          'transcript': transcript_text,
                          'confidence_scores': [
                              item.get('alternatives', [{}])[0].get('confidence', 0)
                              for item in transcription_data.get('results', {}).get('items', [])
                              if item.get('type') == 'pronunciation'
                          ],
                          'processing_timestamp': context.aws_request_id
                      }
                      
                      s3.put_object(
                          Bucket=output_bucket,
                          Key=output_key,
                          Body=json.dumps(processed_data),
                          ContentType='application/json'
                      )
                      
                      logger.info(f"Saved processed transcript to s3://{output_bucket}/{output_key}")
                      
              except Exception as e:
                  logger.error(f"Error processing transcription data: {str(e)}")
                  raise

          def process_video(bucket, key, context):
              """Process video file with MediaConvert"""
              try:
                  # Create MediaConvert job
                  job_settings = {
                      "Role": os.environ.get('MEDIACONVERT_ROLE_ARN', ''),
                      "Settings": {
                          "Inputs": [{
                              "FileInput": f"s3://{bucket}/{key}",
                              "AudioSelectors": {
                                  "Audio Selector 1": {
                                      "Offset": 0,
                                      "DefaultSelection": "DEFAULT",
                                      "ProgramSelection": 1
                                  }
                              },
                              "VideoSelector": {
                                  "ColorSpace": "FOLLOW"
                              }
                          }],
                          "OutputGroups": [{
                              "Name": "File Group",
                              "Outputs": [{
                                  "VideoDescription": {
                                      "Width": 1280,
                                      "Height": 720,
                                      "CodecSettings": {
                                          "Codec": "H_264",
                                          "H264Settings": {
                                              "MaxBitrate": 5000000,
                                              "RateControlMode": "CBR",
                                              "SceneChangeDetect": "TRANSITION_DETECTION"
                                          }
                                      }
                                  },
                                  "AudioDescriptions": [{
                                      "AudioTypeControl": "FOLLOW_INPUT",
                                      "CodecSettings": {
                                          "Codec": "AAC",
                                          "AacSettings": {
                                              "AudioDescriptionBroadcasterMix": "NORMAL",
                                              "Bitrate": 96000,
                                              "RateControlMode": "CBR",
                                              "CodecProfile": "LC",
                                              "CodingMode": "CODING_MODE_2_0",
                                              "RawFormat": "NONE",
                                              "SampleRate": 48000,
                                              "Specification": "MPEG4"
                                          }
                                      }
                                  }],
                                  "ContainerSettings": {
                                      "Container": "MP4",
                                      "Mp4Settings": {
                                          "CslgAtom": "INCLUDE",
                                          "FreeSpaceBox": "EXCLUDE",
                                          "MoovPlacement": "PROGRESSIVE_DOWNLOAD"
                                      }
                                  }
                              }],
                              "OutputGroupSettings": {
                                  "Type": "FILE_GROUP_SETTINGS",
                                  "FileGroupSettings": {
                                      "Destination": f"s3://{os.environ['OUTPUT_BUCKET']}/processed-videos/"
                                  }
                              }
                          }]
                      }
                  }
                  
                  logger.info(f"Created MediaConvert job settings for {key}")
                  
              except Exception as e:
                  logger.error(f"Error creating MediaConvert job: {str(e)}")
                  raise

  # Custom Resource to initialize pipeline
  PipelineInitializer:
    Type: AWS::CloudFormation::CustomResource
    DependsOn:
      - TranslationLambda
      - VideoProcessingLambda
      - OutputBucket
    Properties:
      ServiceToken: !GetAtt PipelineInitializerLambda.Arn
      OutputBucket: !Ref OutputBucket
      InputBucket: !Ref InputBucketName

  PipelineInitializerLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: PipelineInitializerPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutBucketNotification
                  - s3:GetBucketNotification
                Resource: !Sub 'arn:aws:s3:::${InputBucketName}'
              - Effect: Allow
                Action:
                  - lambda:AddPermission
                  - lambda:RemovePermission
                Resource:
                  - !GetAtt TranslationLambda.Arn
                  - !GetAtt VideoProcessingLambda.Arn

  PipelineInitializerLambda:
    Type: AWS::Lambda::Function
    DependsOn:
      - PipelineInitializerLambdaRole
    Properties:
      FunctionName: !Sub 'PipelineInitializer-${EnvironmentName}'
      Runtime: python3.9
      Handler: index.lambda_handler
      Role: !GetAtt PipelineInitializerLambdaRole.Arn
      Timeout: 300
      Code:
        ZipFile: |
          import json
          import boto3
          import cfnresponse
          import logging

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          s3 = boto3.client('s3')
          lambda_client = boto3.client('lambda')

          def lambda_handler(event, context):
              try:
                  logger.info(f"Received event: {json.dumps(event)}")
                  
                  request_type = event['RequestType']
                  
                  if request_type == 'Create' or request_type == 'Update':
                      setup_pipeline(event, context)
                  elif request_type == 'Delete':
                      cleanup_pipeline(event, context)
                      
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                  
              except Exception as e:
                  logger.error(f"Error in pipeline initializer: {str(e)}")
                  cfnresponse.send(event, context, cfnresponse.FAILED, {})

          def setup_pipeline(event, context):
              """Setup S3 event notifications and Lambda permissions"""
              try:
                  properties = event['ResourceProperties']
                  input_bucket = properties['InputBucket']
                  
                  # Add Lambda permission for S3 to invoke functions
                  # This will be handled by the CloudFormation template
                  logger.info("Pipeline setup completed successfully")
                  
              except Exception as e:
                  logger.error(f"Error setting up pipeline: {str(e)}")
                  raise

          def cleanup_pipeline(event, context):
              """Cleanup resources during stack deletion"""
              try:
                  logger.info("Pipeline cleanup completed successfully")
                  
              except Exception as e:
                  logger.error(f"Error cleaning up pipeline: {str(e)}")
                  raise

Outputs:
  OutputBucketName:
    Description: 'Name of the output S3 bucket'
    Value: !Ref OutputBucket
    Export:
      Name: !Sub '${AWS::StackName}-OutputBucket'

  TranslationLambdaArn:
    Description: 'ARN of the Translation Lambda function'
    Value: !GetAtt TranslationLambda.Arn
    Export:
      Name: !Sub '${AWS::StackName}-TranslationLambda'

  VideoProcessingLambdaArn:
    Description: 'ARN of the Video Processing Lambda function'
    Value: !GetAtt VideoProcessingLambda.Arn
    Export:
      Name: !Sub '${AWS::StackName}-VideoProcessingLambda'

  TranslationLambdaLogGroup:
    Description: 'CloudWatch Log Group for Translation Lambda'
    Value: !Ref TranslationLambdaLogGroup
    Export:
      Name: !Sub '${AWS::StackName}-TranslationLambdaLogGroup'

  VideoProcessingLambdaLogGroup:
    Description: 'CloudWatch Log Group for Video Processing Lambda'
    Value: !Ref VideoProcessingLambdaLogGroup
    Export:
      Name: !Sub '${AWS::StackName}-VideoProcessingLambdaLogGroup'